name: Desplegar backend

# Se ejecuta al subir cambios a la rama main (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Comprobar la configuración (Secrets)
        id: config
        env:
          SERVIDOR: ${{ secrets.FTP_SERVER }}
          USUARIO: ${{ secrets.FTP_USUARIO }}
          CLAVE: ${{ secrets.FTP_PASSWORD }}
          CARPETA: ${{ secrets.FTP_CARPETA_BACK }}
        run: |
          fallo=0
          for variable in SERVIDOR USUARIO CLAVE CARPETA; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta el secret equivalente a $variable (FTP_SERVER / FTP_USUARIO / FTP_PASSWORD / FTP_CARPETA_BACK)"
              fallo=1
            fi
          done
          if [ "$fallo" != "0" ]; then
            echo "Revisa: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Los 4 secrets están definidos ✅"

          # La acción FTP exige que la carpeta destino termine en "/"
          # ("server-dir should be a folder"). La normalizamos aquí para que
          # funcione igual si escribes la barra final en el secret o no.
          CARPETA="${CARPETA%/}/"
          case "$CARPETA" in
            /*) echo "Carpeta destino: $CARPETA" ;;
            *)  echo "::warning::La carpeta no empieza por '/'. Si tu cuenta FTP está enjaulada, usa la ruta relativa que ves en el File Manager." ;;
          esac
          echo "carpeta=$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Subir el código por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ steps.config.outputs.carpeta }}
          # NUNCA borrar ni pisar lo que vive sólo en el servidor:
          #   .env           -> credenciales de la base de datos
          #   node_modules   -> dependencias instaladas allí
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/.npm-cache/**
            **/.deploy/**

      - name: Reiniciar la aplicación Node (Passenger)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Subir este archivo actualiza su fecha y Passenger reinicia la app.
          # La carpeta normalizada ya termina en '/', así que aquí se concatena 'tmp/'.
          local-dir: ./.deploy/
          server-dir: ${{ steps.config.outputs.carpeta }}tmp/
          dangerous-clean-slate: false

      - name: Aviso si cambiaron las dependencias
        run: |
          echo "Si esta subida ha modificado package.json, entra en cPanel ->"
          echo "Setup Node.js App -> tu aplicación -> 'Run NPM Install'."
          echo "(El despliegue por FTP no instala dependencias nuevas.)"
