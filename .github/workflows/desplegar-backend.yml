name: Desplegar backend

# Se ejecuta al subir cambios a la rama main (o a mano desde la pestaÃ±a Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el cÃ³digo
        uses: actions/checkout@v4

      - name: Comprobar la configuraciÃ³n (Secrets)
        env:
          SERVIDOR: ${{ secrets.FTP_SERVER }}
          USUARIO: ${{ secrets.FTP_USUARIO }}
          CLAVE: ${{ secrets.FTP_PASSWORD }}
          CARPETA: ${{ secrets.FTP_CARPETA_BACK }}
        run: |
          fallo=0
          for variable in SERVIDOR USUARIO CLAVE CARPETA; do
            if [ -z "${!variable}" ]; then
              echo "::error::Falta el secret equivalente a $variable (FTP_SERVER / FTP_USUARIO / FTP_PASSWORD / FTP_CARPETA_BACK)"
              fallo=1
            fi
          done
          if [ "$fallo" != "0" ]; then
            echo "Revisa: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Los 4 secrets estÃ¡n definidos âœ…"
          case "$CARPETA" in
            */) echo "::warning::FTP_CARPETA_BACK termina en '/'. QuÃ­tale la barra final: se le aÃ±ade '/tmp/' para el reinicio y quedarÃ­a una barra doble." ;;
            /*) echo "Carpeta destino: ruta absoluta âœ… (recuerda: SIN barra final)" ;;
            *)  echo "::warning::FTP_CARPETA_BACK no empieza por '/'. Si tu cuenta FTP estÃ¡ restringida a una carpeta, usa la ruta relativa que ves en el File Manager." ;;
          esac

      - name: Subir el cÃ³digo por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_CARPETA_BACK }}
          # NUNCA borrar ni pisar lo que vive sÃ³lo en el servidor:
          #   .env           -> credenciales de la base de datos
          #   node_modules   -> dependencias instaladas allÃ­
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/.npm-cache/**
            **/.deploy/**

      - name: Reiniciar la aplicaciÃ³n Node (Passenger)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Subir este archivo actualiza su fecha y Passenger reinicia la app.
          local-dir: ./.deploy/
          server-dir: ${{ secrets.FTP_CARPETA_BACK }}/tmp/
          dangerous-clean-slate: false

      - name: Aviso si cambiaron las dependencias
        run: |
          echo "Si esta subida ha modificado package.json, entra en cPanel ->"
          echo "Setup Node.js App -> tu aplicaciÃ³n -> 'Run NPM Install'."
          echo "(El despliegue por FTP no instala dependencias nuevas.)"
